<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimación WUOLLA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 13px; background: #f0f4f8; color: #222; }

  header {
    background: #1A5276; color: #fff; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 12px; opacity: .75; margin-top: 2px; }

  .controls {
    background: #fff; border-bottom: 2px solid #1A5276;
    padding: 12px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .ctrl-group { display: flex; align-items: center; gap: 8px; }
  .ctrl-group label { font-weight: 700; color: #1A5276; white-space: nowrap; }
  .ctrl-group input {
    border: 1.5px solid #A9CCE8; border-radius: 6px; padding: 6px 10px;
    font-size: 13px; color: #1A5276; font-weight: 700; outline: none;
    transition: border-color .2s;
  }
  .ctrl-group input:focus { border-color: #1A5276; }

  .stats {
    background: #EAF4FB; border-bottom: 1px solid #D6EAF8;
    padding: 10px 24px; display: flex; gap: 32px; flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; }
  .stat span:first-child { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .5px; }
  .stat span:last-child { font-size: 15px; font-weight: 700; color: #1A5276; }

  .table-wrap { overflow-x: auto; padding: 16px 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  thead tr { background: #1A5276; color: #fff; }
  thead th { padding: 11px 10px; text-align: left; font-size: 12px; font-weight: 700; white-space: nowrap; }
  thead th.center { text-align: center; }

  tbody tr { border-bottom: 1px solid #EBF5FB; transition: background .15s; }
  tbody tr:hover { background: #F2F8FC; }
  tbody tr.no-hours { opacity: .55; }

  td { padding: 9px 10px; vertical-align: middle; }
  td.center { text-align: center; }
  td.task { max-width: 340px; line-height: 1.4; }
  td.id { font-weight: 700; color: #1A5276; white-space: nowrap; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .badge-alta    { background: #FADBD8; color: #922B21; }
  .badge-baja    { background: #D5F5E3; color: #1E8449; }
  .badge-media   { background: #FEF9E7; color: #9A7D0A; }
  .badge-pend    { background: #EBF5FB; color: #1A5276; }
  .badge-front   { background: #F9F0FF; color: #6C3483; }
  .badge-back    { background: #FFF3E0; color: #A04000; }
  .badge-fb      { background: #E8F8F5; color: #0E6655; }

  .date-cell { text-align: center; }
  .date-val  { font-weight: 700; color: #1A5276; font-size: 12px; }
  .day-name  { font-size: 10px; color: #7FB3D3; margin-top: 1px; }
  .no-date   { color: #BBB; font-style: italic; font-size: 11px; }

  .hours-input {
    width: 64px; border: 1.5px solid #D6EAF8; border-radius: 6px;
    padding: 4px 6px; text-align: center; font-size: 13px; font-weight: 700;
    color: #1A5276; outline: none; background: #EAF4FB;
    transition: border-color .2s, background .2s;
  }
  .hours-input:focus { border-color: #1A5276; background: #fff; }
  .hours-input.changed { border-color: #27AE60; background: #D5F5E3; }

  .val-ok   { color: #1E8449; font-size: 11px; font-weight: 700; }
  .val-warn { color: #922B21; font-size: 11px; font-weight: 700; }
  .val-none { color: #BBB; font-size: 11px; font-style: italic; }

  .export-btn {
    background: #27AE60; color: #fff; border: none; border-radius: 6px;
    padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background .2s;
  }
  .export-btn:hover { background: #1E8449; }

  .legend { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 11px; color: #555; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 Control de Estimación — WUOLLA</h1>
    <div class="sub">Las fechas se recalculan automáticamente · Lunes a Viernes · Horas acumuladas por día</div>
  </div>
  <button class="export-btn" onclick="exportCSV()">⬇ Exportar CSV</button>
</header>

<div class="controls">
  <div class="ctrl-group">
    <label>📅 Fecha inicio:</label>
    <input type="date" id="startDate" value="2026-06-18" oninput="recalc()">
  </div>
  <div class="ctrl-group">
    <label>⏱ Horas por día:</label>
    <input type="number" id="hpd" value="8" min="1" max="24" style="width:70px" oninput="recalc()">
  </div>
  <div class="legend">
    <span><span class="legend-dot" style="background:#D6E8FF"></span>Fechas calculadas</span>
    <span><span class="legend-dot" style="background:#FADBD8"></span>Sin horas</span>
    <span><span class="legend-dot" style="background:#D5F5E3"></span>Horas modificadas</span>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Módulo</th>
      <th>Funcionalidad / Tarea</th>
      <th class="center">Horas</th>
      <th class="center">Prioridad</th>
      <th class="center">Responsable</th>
      <th class="center">Estado</th>
      <th class="center">Fecha Inicio</th>
      <th class="center">Fecha Fin</th>
      <th class="center">Tipo</th>
      <th class="center">✓ Día</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
const TASKS = [
  {id:"WUO-001",modulo:"WUOLLA",tarea:"PRUEBAS DE INTEGRACIÓN CON SERVIENTREGA",horas:null,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:""},
  {id:"WUO-002",modulo:"WUOLLA",tarea:"CONTAR CON TODO EL PORTAFOLIO CARGADO EN WUOLLA",horas:null,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:""},
  {id:"WUO-003",modulo:"WUOLLA",tarea:"PRIORIZAR LA BÚSQUEDA POR RELACIÓN DE MOLÉCULAS CON PROVEEDORES QUE MANTENGAN CONVENIO DE ESPACIOS.",horas:null,prioridad:"Alta",responsable:"",estado:"Pendiente",tipo:"Front/Back"},
  {id:"WUO-004",modulo:"WUOLLA",tarea:"CONSOLIDAR LAS ÓRDENES DE CRUZ AZUL Y LA GANGA PARA UNA VISUALIZACIÓN MÁS ORDENADA EN EL FRONT DE LA ORDEN.",horas:null,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-005",modulo:"WUOLLA",tarea:"CONFIRMAR LA PERIODICIDAD DE LOS COMUNICADOS AUTOMÁTICOS: CARRITO ABANDONADO.",horas:2,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Backend"},
  {id:"WUO-006",modulo:"WUOLLA",tarea:"CONFIRMACIÓN COMUNICADOS POR PRODUCTOS RELACIONADOS POR COMPRAS REALIZADAS O PENDIENTE (RETARGETING).",horas:null,prioridad:"Alta",responsable:"",estado:"Pendiente",tipo:"Backend"},
  {id:"WUO-007",modulo:"WUOLLA",tarea:"CONFIRMAR EL TEXTO DEFINITIVO QUE SE MOSTRARÁ EN LAS SECCIONES \"MANEJO Y ENVÍO\" Y \"FEE DE SERVICIO\".",horas:1,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-008",modulo:"WUOLLA",tarea:"INCORPORAR LOS LOGOS DE CRUZ AZUL Y LA GANGA EN EL DETALLE DE LA ORDEN.",horas:2,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-009",modulo:"WUOLLA",tarea:"CAMBIAR EL WIDGET DE CHAT AL ISOTIPO DE WUOLLA CON ÍCONO DE AURICULAR/CALL CENTER.",horas:1,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-010",modulo:"WUOLLA",tarea:"CONFIRMAR LA CONFIGURACIÓN DE CUPONES POR PROVEEDOR, INFLUENCER O PRODUCTO.",horas:null,prioridad:"Alta",responsable:"",estado:"Pendiente",tipo:"Front/Back"},
  {id:"WUO-011",modulo:"WUOLLA",tarea:"AJUSTAR LA VISUALIZACIÓN DE UBICACIÓN/DIRECCIÓN PARA ENVÍOS A DOMICILIO Y RETIROS EN TIENDA, MINIMIZANDO EL LISTADO DE FARMACIAS MOSTRADAS.",horas:8,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-012",modulo:"WUOLLA",tarea:"VALIDAR EL FLUJO DE SELECCIÓN DE UBICACIÓN, PRIORIZANDO PRIMERO LA FARMACIA Y POSTERIORMENTE EL MAPA.",horas:2,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-013",modulo:"WUOLLA",tarea:"IMPLEMENTAR LA BARRA DE BUSQUEDA DE FARMACIA EN EL LISTADO",horas:2,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-014",modulo:"WUOLLA",tarea:"CAMBIAR COLOR DE LOS LOGOS DE LISTA Y MAPA.",horas:2,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:""},
  {id:"WUO-015",modulo:"WUOLLA",tarea:"IMPLEMENTAR NOTIFICACIONES DE PEDIDO EN PROCESO.",horas:null,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-016",modulo:"WUOLLA",tarea:"RECOMENDACIONES DE PRODUCTOS SIMILARES, CUANDO BUSCO ALGO COMPLEMENTARIO.",horas:null,prioridad:"Alta",responsable:"",estado:"Pendiente",tipo:"Backend"},
  {id:"WUO-017",modulo:"WUOLLA",tarea:"AGREGAR FORMAS DE PAGO: APPLE PAY + GOOGLE PAY.",horas:null,prioridad:"Alta",responsable:"",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-018",modulo:"WUOLLA",tarea:"BANNER LINKEADO A LA CATEGORIA",horas:6,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Frontend"},
  {id:"WUO-019",modulo:"WUOLLA",tarea:"ALERTA POR NUEVOS DESCUENTOS",horas:8,prioridad:"Alta",responsable:"Andrea",estado:"Pendiente",tipo:"Front/Back"},
  {id:"WUO-020",modulo:"WUOLLA",tarea:"LA GANGA : AUTOMATIZAR EL TRACKING DE FACTURACIÓN EN EL PORTAL ADMINISTRATIVO.",horas:null,prioridad:"Baja",responsable:"",estado:"Pendiente",tipo:"Front/Back"},
  {id:"WUO-021",modulo:"WUOLLA",tarea:"LA GANGA: CHECKOUT Y EXPERIENCIA DE USUARIO : EN EL RESUMEN DE LA ORDEN, IMPLEMENTAR FILTROS DE TIENDAS POR PROVINCIA Y CIUDAD.",horas:null,prioridad:"Baja",responsable:"",estado:"Pendiente",tipo:"Front/Back"},
  {id:"WUO-022",modulo:"WUOLLA",tarea:"LA GANGA: INTEGRACIÓN (APIS) Y PRUEBAS. CREAR Y FACILITAR UN PANEL ADMINISTRATIVO PARA ALIADOS COMERCIALES",horas:null,prioridad:"Baja",responsable:"",estado:"Pendiente",tipo:"Front/Back"},
  {id:"WUO-023",modulo:"WUOLLA",tarea:"LA GANGA : HABILITAR ACCESO AL PORTAL ADMINISTRATIVO PARA PARTNERS (USUARIO/ROLES) Y ASEGURAR QUE LOS PARTNERS VEAN SUS ÓRDENES, DATOS DEL BENEFICIARIO, GUÍA/TRACKING Y ESTADO DE FACTURACIÓN.",horas:null,prioridad:"Baja",responsable:"",estado:"Pendiente",tipo:"Front/Back"},
];

// Mutable copy of hours
const hours = TASKS.map(t => t.horas);
const DAYS_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYS_FULL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }

function firstWorkday(d) {
  const r = new Date(d);
  while (isWeekend(r)) r.setDate(r.getDate() + 1);
  return r;
}

function nextWorkday(d) {
  const r = new Date(d);
  r.setDate(r.getDate() + 1);
  while (isWeekend(r)) r.setDate(r.getDate() + 1);
  return r;
}

function fmtDate(d) {
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  return `${dd}/${mm}/${yy}`;
}

function calcDates() {
  const startStr = document.getElementById('startDate').value;
  const hpd = parseFloat(document.getElementById('hpd').value) || 8;
  if (!startStr) return [];

  // Parse date avoiding timezone issues
  const [y,m,d] = startStr.split('-').map(Number);
  let day = firstWorkday(new Date(y, m-1, d));
  let hLeft = hpd;
  const results = [];

  for (let i = 0; i < TASKS.length; i++) {
    const h = hours[i];
    if (!h || h <= 0) {
      results.push({ start: null, end: null });
      continue;
    }
    let pending   = h;
    const tStart  = new Date(day);
    while (pending > 0) {
      const use = Math.min(pending, hLeft);
      pending -= use;
      hLeft   -= use;
      if (hLeft === 0 && pending > 0) {
        day   = nextWorkday(day);
        hLeft = hpd;
      }
    }
    const tEnd = new Date(day);
    if (hLeft === 0) {
      day   = nextWorkday(day);
      hLeft = hpd;
    }
    results.push({ start: tStart, end: tEnd });
  }
  return results;
}

function badgeClass(val, type) {
  if (type === 'prio') {
    if (val==='Alta') return 'badge-alta';
    if (val==='Baja') return 'badge-baja';
    return 'badge-media';
  }
  if (type==='tipo') {
    if (val==='Frontend') return 'badge-front';
    if (val==='Backend')  return 'badge-back';
    if (val==='Front/Back') return 'badge-fb';
    return 'badge-pend';
  }
  return 'badge-pend';
}

function recalc() {
  const dates   = calcDates();
  const hpd     = parseFloat(document.getElementById('hpd').value) || 8;
  const tbody   = document.getElementById('tbody');
  tbody.innerHTML = '';

  let totalH = 0, withDates = 0, sinH = 0;
  let lastEnd = null;

  for (let i = 0; i < TASKS.length; i++) {
    const t = TASKS[i];
    const h = hours[i];
    const { start, end } = dates[i] || {};
    const hasH = h && h > 0;
    if (hasH) { totalH += h; withDates++; lastEnd = end; }
    else sinH++;

    // Date cells
    let startCell, endCell, valCell;
    if (start) {
      const warnS = isWeekend(start);
      const warnE = isWeekend(end);
      startCell = `<div class="date-val">${fmtDate(start)}</div><div class="day-name">${DAYS_FULL[start.getDay()]}</div>`;
      endCell   = `<div class="date-val">${fmtDate(end)}</div><div class="day-name">${DAYS_FULL[end.getDay()]}</div>`;
      if (warnS || warnE) {
        valCell = `<span class="val-warn">⚠ Fin de semana</span>`;
      } else {
        valCell = `<span class="val-ok">✓ ${DAYS_ES[start.getDay()]} → ${DAYS_ES[end.getDay()]}</span>`;
      }
    } else {
      startCell = `<span class="no-date">Sin estimar</span>`;
      endCell   = `<span class="no-date">Sin estimar</span>`;
      valCell   = `<span class="val-none">—</span>`;
    }

    const row = document.createElement('tr');
    if (!hasH) row.classList.add('no-hours');
    row.innerHTML = `
      <td class="id">${t.id}</td>
      <td>${t.modulo}</td>
      <td class="task">${t.tarea}</td>
      <td class="center">
        <input class="hours-input ${h !== t.horas ? 'changed':''}"
               type="number" min="0" step="0.5" value="${h ?? ''}"
               placeholder="—"
               oninput="updateHours(${i}, this.value, this)"
               data-orig="${t.horas ?? ''}">
      </td>
      <td class="center"><span class="badge ${badgeClass(t.prioridad,'prio')}">${t.prioridad}</span></td>
      <td class="center">${t.responsable || '—'}</td>
      <td class="center"><span class="badge badge-pend">${t.estado}</span></td>
      <td class="date-cell">${startCell}</td>
      <td class="date-cell">${endCell}</td>
      <td class="center">${t.tipo ? `<span class="badge ${badgeClass(t.tipo,'tipo')}">${t.tipo}</span>` : '—'}</td>
      <td class="center">${valCell}</td>
    `;
    tbody.appendChild(row);
  }

  // Stats
  const endStr = lastEnd ? fmtDate(lastEnd) + ' (' + DAYS_FULL[lastEnd.getDay()] + ')' : '—';
  document.getElementById('stats').innerHTML = `
    <div class="stat"><span>Total tareas</span><span>${TASKS.length}</span></div>
    <div class="stat"><span>Con horas</span><span>${withDates}</span></div>
    <div class="stat"><span>Sin horas</span><span>${sinH}</span></div>
    <div class="stat"><span>Total horas estimadas</span><span>${totalH}h</span></div>
    <div class="stat"><span>Horas por día</span><span>${hpd}h</span></div>
    <div class="stat"><span>📅 Fecha fin estimada</span><span>${endStr}</span></div>
  `;
}

function updateHours(i, val, el) {
  const v = parseFloat(val);
  hours[i] = (!val || val==='' || isNaN(v) || v <= 0) ? null : v;
  const orig = parseFloat(el.dataset.orig);
  el.classList.toggle('changed', hours[i] !== (isNaN(orig) ? null : orig));
  recalc();
}

function exportCSV() {
  const dates = calcDates();
  const hpd   = document.getElementById('hpd').value;
  const start = document.getElementById('startDate').value;
  let csv = 'ID,Módulo,Tarea,Horas,Prioridad,Responsable,Estado,Fecha Inicio,Fecha Fin,Tipo\n';
  for (let i = 0; i < TASKS.length; i++) {
    const t = TASKS[i];
    const h = hours[i] ?? '';
    const s = dates[i]?.start ? fmtDate(dates[i].start) : '';
    const e = dates[i]?.end   ? fmtDate(dates[i].end)   : '';
    csv += `"${t.id}","${t.modulo}","${t.tarea}","${h}","${t.prioridad}","${t.responsable}","${t.estado}","${s}","${e}","${t.tipo}"\n`;
  }
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Estimacion_WUOLLA_${start}.csv`;
  a.click();
}

// Initial render
recalc();
</script>
</body>
</html>
