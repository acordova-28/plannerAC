services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: wuolla_planner
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema_wuolla.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Toda la config (JWT, LDAP, Azure, DEV_USERS, etc.) sale de un único archivo:
    # apps/backend/.env — las claves de abajo solo pisan lo que debe ser distinto
    # dentro de la red de Docker (el backend habla con "db:3306", no con localhost:3307).
    env_file: apps/backend/.env
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: secret
      DB_NAME: wuolla_planner
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  db_data:
