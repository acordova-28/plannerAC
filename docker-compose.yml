services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-wuolla_planner}
    ports:
      - '${DB_HOST_PORT:-3307}:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema_wuolla.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: http://localhost:5173
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-wuolla_planner}
      JWT_SECRET: ${JWT_SECRET:-cambia_esto_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_PLANS_BASE: ${LDAP_PLANS_BASE:-}
      DEV_USERS: ${DEV_USERS:-admin:admin1,demo:demo}
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  db_data:
