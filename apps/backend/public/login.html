<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WUOLLA — Acceso</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1A5276;
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 12px; opacity: .7; margin-top: 3px; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.1);
    padding: 40px;
    width: 100%;
    max-width: 400px;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    color: #1A5276;
    margin-bottom: 28px;
    text-align: center;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #1A5276;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    border: 1.5px solid #A9CCE8;
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 14px;
    color: #222;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: #1A5276; }

  .btn {
    width: 100%;
    background: #1A5276;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
    margin-top: 8px;
  }
  .btn:hover { background: #154360; }
  .btn:disabled { background: #7FB3D3; cursor: not-allowed; }

  .error {
    background: #FADBD8;
    color: #922B21;
    border: 1px solid #F1948A;
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 18px;
    display: none;
  }
  .error.visible { display: block; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 WUOLLA Planner</h1>
    <div class="sub">Control de estimación y seguimiento de tareas</div>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-title">Iniciar sesión</div>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username"
               placeholder="tu.usuario" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Entrar</button>
    </form>
  </div>
</main>

<script>
const TOKEN_KEY = 'wuolla_token';

// Si ya hay un token válido, ir directamente a la app
function isTokenValid(token) {
  if (!token) return false;
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    return payload.exp * 1000 > Date.now();
  } catch {
    return false;
  }
}

if (isTokenValid(localStorage.getItem(TOKEN_KEY))) {
  window.location.replace('/Estimacion_WUOLLA.html');
}

// Formulario de login
const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('visible');
}
function hideError() {
  errorMsg.classList.remove('visible');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) {
    showError('Por favor ingresa usuario y contraseña.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Verificando...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });

    if (res.ok) {
      const data = await res.json();
      localStorage.setItem(TOKEN_KEY, data.token);
      window.location.replace('/Estimacion_WUOLLA.html');
    } else {
      const data = await res.json().catch(() => ({}));
      showError(data.message || 'Usuario o contraseña incorrectos.');
    }
  } catch {
    showError('No se pudo conectar con el servidor. Intenta de nuevo.');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
